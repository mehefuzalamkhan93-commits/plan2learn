services:
  - type: web
    name: plan2learn-backend

    env: python
    region: singapore # Closest to AWS ap-south-1 (Mumbai) for low latency to Turso
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_BACKEND
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false # Set via Render Dashboard Environment settings
      - key: TURSO_AUTH_TOKEN
        sync: false # Set via Render Dashboard Environment settings (keep secret!)
      - key: JWT_SECRET_KEY
        generateValue: true # Render automatically generates a secure 256-bit key
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://plan2learn-ashen.vercel.app","https://plan2learn.vercel.app"]'
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_API_KEY
        sync: false

